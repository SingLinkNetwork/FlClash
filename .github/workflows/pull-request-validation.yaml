name: pull-request-validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  test:
    name: Dart tests and analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Test Go core scheduler
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: go test .

      - name: Verify delay test concurrency alignment
        run: ruby tool/verify_delay_test_concurrency.rb

  build:
    name: Build ${{ matrix.platform }} on ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            artifact_path: build/app/outputs/flutter-apk/app-debug.apk
          - platform: linux
            os: ubuntu-24.04
            artifact_path: build/linux/x64/debug/bundle
          - platform: windows
            os: windows-2022
            artifact_path: build/windows/x64/runner/Debug
          - platform: macos
            os: macos-15-intel
            artifact_path: build/macos/Build/Products/Debug/FlClash.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable git long paths
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libkeybinder-3.0-dev \
            ninja-build

      - name: Setup Android CI configuration
        if: matrix.platform == 'android'
        run: cp android/app/google-services.ci.json android/app/google-services.json

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android
        if: matrix.platform == 'android'
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify Android background location permission
        if: matrix.platform == 'android'
        run: ruby tool/verify_android_background_location_permission.rb

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: flutter build linux --debug

      - name: Verify Linux QuickJS bundle
        if: matrix.platform == 'linux'
        run: ruby tool/verify_linux_quickjs_bundle.rb build/linux/x64/debug/bundle

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: flutter build windows --debug

      - name: Verify Windows proxy shutdown cleanup
        if: matrix.platform == 'windows'
        run: ruby tool/verify_windows_proxy_shutdown.rb

      - name: Verify desktop render visibility
        if: matrix.platform == 'windows'
        run: ruby tool/verify_desktop_render_visibility.rb

      - name: Verify Windows Wi-Fi SSID optional dependency
        if: matrix.platform == 'windows'
        run: ruby tool/verify_windows_wifi_ssid_plugin.rb

      - name: Verify Windows installer runtime
        if: matrix.platform == 'windows'
        run: ruby tool/verify_windows_installer_runtime.rb

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $innoSetup = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $innoSetup)) {
            choco install innosetup --no-progress --yes
          }
          dart setup.dart windows --targets exe
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer build failed with exit code $LASTEXITCODE"
          }
          $installer = Get-ChildItem -Path dist -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $installer) {
            throw 'Windows installer artifact was not generated'
          }

      - name: Verify Windows installer installs Visual C++ runtime
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $installer) {
            throw 'Windows installer artifact was not generated'
          }
          $runtimeKey = 'HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64'
          $installerLog = Join-Path $env:TEMP 'flclash-installer.log'
          New-Item -Path $runtimeKey -Force | Out-Null
          New-ItemProperty -Path $runtimeKey -Name Installed -PropertyType DWord -Value 0 -Force | Out-Null
          try {
            $process = Start-Process -FilePath $installer.FullName -ArgumentList @(
              '/VERYSILENT',
              '/SUPPRESSMSGBOXES',
              '/NORESTART',
              '/SP-',
              "/LOG=$installerLog"
            ) -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              if (Test-Path $installerLog) {
                Get-Content $installerLog
              }
              throw "Windows installer execution failed with exit code $($process.ExitCode)"
            }
            $downloaded = Select-String -Path $installerLog -Pattern 'Downloading Microsoft Visual C\+\+ Redistributable'
            $executed = Select-String -Path $installerLog -Pattern 'Microsoft Visual C\+\+ Redistributable installer returned (0|3010)'
            if (-not $downloaded -or -not $executed) {
              Get-Content $installerLog
              throw 'Windows installer did not execute the Visual C++ runtime bootstrap path successfully'
            }
          } finally {
            New-Item -Path $runtimeKey -Force | Out-Null
            New-ItemProperty -Path $runtimeKey -Name Installed -PropertyType DWord -Value 1 -Force | Out-Null
          }

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: flutter build macos --debug

      - name: Verify macOS window lifecycle
        if: matrix.platform == 'macos'
        run: ruby tool/verify_macos_window_lifecycle.rb

      - name: Verify macOS tray position preservation
        if: matrix.platform == 'macos'
        run: ruby tool/verify_macos_tray_destroy.rb

      - name: Verify macOS SQLite bundle and loader
        if: matrix.platform == 'macos'
        run: ruby tool/verify_macos_sqlite_bundle.rb build/macos/Build/Products/Debug/FlClash.app lib/common/sqlite.dart x86_64

      - name: Verify macOS Wi-Fi SSID safety
        if: matrix.platform == 'macos'
        run: ruby tool/verify_macos_wifi_ssid_plugin.rb

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ matrix.platform }}-build
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
